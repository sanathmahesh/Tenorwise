[project]
name = "tenorwise"
version = "0.1.0"
description = "Interest-rate risk and hedging tool for a bank-style bond portfolio, with a verified AI analyst."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime dependencies only. Vercel installs this list into the Python
# function, so anything here ships to production. Keep it minimal.
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=2.0",
    "pydantic>=2.7",
    "scipy>=1.13",
]

[dependency-groups]
# Local development, tests and eval reporting. Never installed in the function.
# QuantLib is the independent benchmark (tests only). pandas is for eval
# reporting; it is kept out of the runtime list so it cannot be imported on
# the request path even by accident.
dev = [
    "pandas>=2.2",
    "pytest>=8.0",
    "QuantLib>=1.34",
    "uvicorn>=0.54.0",
]

[tool.uv]
# Tenorwise is an application, not a library: run from the repo root.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "live: calls a real external service; skipped unless explicitly enabled",
]
